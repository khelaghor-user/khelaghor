<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="আমার খেলাঘর">
<title>আমার খেলাঘর — Live Football & Cricket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" id="pwaManifest">
<style>
:root{
  --bg-0:#050510;--glass:rgba(255,255,255,.045);--glass-2:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.07);--stroke-2:rgba(255,255,255,.12);--stroke-3:rgba(255,255,255,.18);
  --text:#FFFFFF;--text-2:#B4B4D0;--text-3:#6E6E8E;--text-4:#4A4A66;
  --lime:#D4FF3A;--lime-2:#9BC72A;--emerald:#10B981;--emerald-2:#059669;
  --crimson:#FF3B5C;--crimson-2:#DC2626;--violet:#8B5CF6;--amber:#FFB020;--cyan:#22D3EE;
  --r-lg:20px;--r-xl:26px;
  --font-bn:"Hind Siliguri",system-ui,sans-serif;--font-en:"Inter",system-ui,sans-serif;
  --hdr-h:62px;--nav-h:72px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-y:none}
body{
  font-family:var(--font-bn);background:var(--bg-0);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;
  padding-top:calc(var(--hdr-h) + env(safe-area-inset-top));
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(900px 500px at 15% -10%, rgba(139,92,246,.22), transparent 60%),
  radial-gradient(700px 400px at 90% 0%, rgba(34,211,238,.16), transparent 60%),
  radial-gradient(800px 500px at 50% 110%, rgba(16,185,129,.14), transparent 60%),
  radial-gradient(600px 300px at 100% 100%, rgba(212,255,58,.06), transparent 70%);}
button{border:0;background:none;color:inherit;font-family:inherit;cursor:pointer;font-size:inherit}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}svg{display:block}

/* ===== OFFLINE ===== */
.offline-bar{position:fixed;top:calc(var(--hdr-h) + env(safe-area-inset-top));left:0;right:0;z-index:890;
  padding:10px 14px;background:linear-gradient(90deg,rgba(255,176,32,.95),rgba(217,119,6,.95));
  color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  transform:translateY(-100%);transition:transform .4s var(--ease-out);box-shadow:0 8px 30px -8px rgba(255,176,32,.6);backdrop-filter:blur(12px)}
.offline-bar.on{transform:translateY(0)}
.offline-bar svg{width:14px;height:14px;stroke:#fff;stroke-width:2.4;fill:none}

/* ===== HEADER ===== */
.hdr{position:fixed;top:0;left:0;right:0;z-index:900;height:calc(var(--hdr-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;background:linear-gradient(180deg,rgba(5,5,16,.96),rgba(5,5,16,.72) 70%,transparent);
  backdrop-filter:blur(28px) saturate(180%);border-bottom:1px solid var(--stroke);display:flex;align-items:center}
.hdr-inner{height:var(--hdr-h);display:flex;align-items:center;gap:8px;width:100%}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--lime),var(--lime-2) 60%,#79A81E);
  display:grid;place-items:center;color:#050510;box-shadow:0 10px 26px -10px rgba(212,255,58,.75),inset 0 1px 0 rgba(255,255,255,.5);
  position:relative;overflow:hidden}
.logo-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%);pointer-events:none}
.logo-mark svg{width:20px;height:20px;stroke:#050510;stroke-width:2.6;fill:none;position:relative;z-index:1}
.logo-text b{font-weight:700;font-size:15px;display:block;line-height:1;letter-spacing:-.2px}
.logo-text span{font-family:var(--font-en);font-weight:700;font-size:7.5px;letter-spacing:2.4px;color:var(--text-3);display:block;margin-top:3px;text-transform:uppercase}
.hdr-spacer{flex:1}
.hdr-btn{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--stroke);
  display:grid;place-items:center;transition:transform .2s var(--ease-spring),background .2s;position:relative;flex-shrink:0}
.hdr-btn:active{transform:scale(.88);background:var(--glass-2)}
.hdr-btn svg{width:17px;height:17px;stroke:var(--text-2);stroke-width:2;fill:none}
.hdr-btn.spin svg{animation:spin .9s linear infinite}
.hdr-btn.install{background:linear-gradient(135deg,var(--lime),var(--lime-2));border-color:transparent;box-shadow:0 8px 22px -8px rgba(212,255,58,.7)}
.hdr-btn.install svg{stroke:#050510;stroke-width:2.6}
.hdr-btn .conn-dot{position:absolute;bottom:5px;right:5px;width:8px;height:8px;border-radius:50%;
  background:var(--emerald);border:1.5px solid var(--bg-0);box-shadow:0 0 8px var(--emerald);transition:.35s}
.hdr-btn .conn-dot.off{background:var(--crimson);box-shadow:0 0 8px var(--crimson)}
.hdr-btn .conn-dot.checking{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* ===== SEARCH ===== */
.search-wrap{margin:12px 14px 8px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-3);stroke-width:2.2;fill:none;pointer-events:none}
.search-input{width:100%;padding:12px 14px 12px 42px;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
  color:var(--text);font-size:13px;font-family:inherit;transition:.2s}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{outline:none;border-color:var(--lime);background:rgba(212,255,58,.05);box-shadow:0 0 0 3px rgba(212,255,58,.12)}

/* ===== TICKER ===== */
.ticker{margin:0 14px 10px;height:32px;border-radius:12px;background:linear-gradient(90deg,rgba(212,255,58,.10),rgba(16,185,129,.06));
  border:1px solid rgba(212,255,58,.22);display:flex;align-items:center;overflow:hidden;font-size:11px;font-family:var(--font-en);font-weight:700}
.ticker .lbl{background:linear-gradient(135deg,var(--lime),var(--lime-2));color:#050510;padding:0 11px;height:100%;display:flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.8px;flex-shrink:0;font-weight:800}
.ticker .lbl::before{content:"";width:5px;height:5px;border-radius:50%;background:#050510;animation:pulse 1s infinite}
.ticker-track{flex:1;overflow:hidden;position:relative;height:100%}
.ticker-items{display:flex;align-items:center;gap:26px;padding-left:12px;height:100%;animation:tickerScroll 45s linear infinite;white-space:nowrap}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.ticker-item b{color:var(--lime);font-weight:800}

/* ===== SPORT SWITCH ===== */
.sport-switch{margin:0 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;position:relative;overflow:hidden}
.sport-switch::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:11px;
  background:linear-gradient(135deg,var(--lime),var(--lime-2));transition:transform .4s var(--ease-out),background .4s;box-shadow:0 8px 22px -8px rgba(212,255,58,.7)}
.sport-switch[data-active="cricket"]::before{transform:translateX(calc(100% + 2px));background:linear-gradient(135deg,var(--emerald),var(--emerald-2));box-shadow:0 8px 22px -8px rgba(16,185,129,.7)}
.sport-btn{position:relative;z-index:1;padding:10px 6px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--text-3);font-family:var(--font-en);letter-spacing:.4px;transition:color .25s}
.sport-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.sport-btn.on{color:#050510}

/* ===== PAGES ===== */
.page{display:none;animation:pageIn .45s var(--ease-out)}
.page.on{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== CHIPS ===== */
.chips{display:flex;gap:7px;padding:0 14px 14px;overflow-x:auto}
.chip{flex-shrink:0;padding:8px 15px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);
  font-size:11.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;transition:all .22s var(--ease-out);white-space:nowrap}
.chip:active{transform:scale(.94)}
.chip.on{background:rgba(255,255,255,.1);border-color:var(--stroke-3);color:#fff}
.chip.on.live{background:linear-gradient(135deg,rgba(255,59,92,.22),rgba(255,59,92,.08));border-color:rgba(255,59,92,.45);color:#FF8DA3}
.chip.on.intl{background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(139,92,246,.10));border-color:rgba(139,92,246,.5);color:#C4B5FD}
.chip.on.fav{background:linear-gradient(135deg,rgba(255,176,32,.24),rgba(255,176,32,.10));border-color:rgba(255,176,32,.5);color:#FFD98A}
.chip .cnt{background:rgba(255,255,255,.08);padding:1px 7px;border-radius:6px;font-family:var(--font-en);font-weight:700;font-size:9.5px}
.chip.on .cnt{background:rgba(0,0,0,.28)}

/* ===== SECTIONS ===== */
.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px;margin-top:6px}
.sec-hd h2{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-hd h2 .pulse{width:7px;height:7px;border-radius:50%;background:var(--crimson);box-shadow:0 0 10px var(--crimson);animation:pulse 1.4s infinite}
.sec-hd h2 .globe{font-size:15px}
.sec-hd a{font-size:10.5px;color:var(--text-3);font-weight:600;font-family:var(--font-en)}
.intl-hd{background:linear-gradient(90deg,rgba(139,92,246,.12),transparent)!important;border-bottom-color:rgba(139,92,246,.2)!important}
.intl-hd h2{color:#C4B5FD}
.fav-hd{background:linear-gradient(90deg,rgba(255,176,32,.12),transparent)!important;border-bottom-color:rgba(255,176,32,.2)!important}
.fav-hd h2{color:#FFD98A}

/* ===== HERO ===== */
.hero-wrap{padding:0 14px 16px}
.hero{border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,59,92,.14),rgba(139,92,246,.10) 50%,rgba(34,211,238,.08));
  border:1px solid rgba(255,59,92,.22);box-shadow:0 20px 60px -25px rgba(255,59,92,.4)}
.hero::before{content:"";position:absolute;top:-80px;right:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,59,92,.32),transparent 65%);filter:blur(8px);animation:float 9s ease-in-out infinite}
.hero::after{content:"";position:absolute;bottom:-100px;left:-50px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.28),transparent 65%);filter:blur(8px);animation:float 12s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8px,12px) scale(1.08)}}
.hero-in{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hero-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  background:rgba(255,59,92,.18);border:1px solid rgba(255,59,92,.35);font-family:var(--font-en);
  font-size:9px;font-weight:800;letter-spacing:1.2px;color:#FF8DA3;text-transform:uppercase}
.hero-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--crimson);animation:pulse 1.2s infinite}
.hero-min{font-family:var(--font-en);font-size:10.5px;font-weight:800;color:var(--text-2)}
.hero-min b{color:var(--lime);font-size:13px}
.hero-star{position:absolute;top:12px;right:14px;z-index:2;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid var(--stroke-2);display:grid;place-items:center;transition:.2s}
.hero-star:active{transform:scale(.9)}
.hero-star svg{width:15px;height:15px;stroke:var(--text-2);stroke-width:2;fill:none}
.hero-star.on svg{stroke:var(--amber);fill:var(--amber)}
.hero-star.on{background:rgba(255,176,32,.15);border-color:rgba(255,176,32,.4)}
.hero-comp{font-size:10.5px;color:var(--text-3);font-family:var(--font-en);font-weight:600;margin-bottom:16px;text-align:center;text-transform:uppercase}
.hero-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.crest-lg{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-family:var(--font-en);font-weight:900;font-size:20px;border:1px solid var(--stroke-2);overflow:hidden;flex-shrink:0}
.hero-team .name{font-size:12px;font-weight:700;line-height:1.25;max-width:100px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero-score{display:flex;flex-direction:column;align-items:center;gap:4px}
.hero-score .num{font-family:var(--font-en);font-weight:900;font-size:36px;line-height:1;letter-spacing:-2.4px;display:flex;gap:10px;align-items:baseline}
.hero-score .num i{font-style:normal;color:var(--text-3);font-size:20px;font-weight:800;opacity:.55}
.hero-score .vs{font-family:var(--font-en);font-size:10.5px;font-weight:800;color:var(--text-3);letter-spacing:1.6px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid var(--stroke)}
.live-progress{margin-top:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.live-progress i{position:absolute;top:0;left:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--crimson),var(--violet))}

/* ===== LEAGUE GROUP ===== */
.league-group{margin:0 14px 14px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke);overflow:hidden;animation:fadeUp .5s var(--ease-out) both}
.league-group.intl{border-color:rgba(139,92,246,.28);background:linear-gradient(180deg,rgba(139,92,246,.06),var(--glass))}
.league-group.fav{border-color:rgba(255,176,32,.28);background:linear-gradient(180deg,rgba(255,176,32,.06),var(--glass))}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.league-hd{display:flex;align-items:center;gap:9px;padding:13px 14px;background:linear-gradient(90deg,rgba(255,255,255,.03),transparent);border-bottom:1px solid var(--stroke)}
.league-flag{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);flex-shrink:0;overflow:hidden}
.league-name{flex:1;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.league-name small{display:block;font-size:9.5px;color:var(--text-3);font-weight:500;margin-top:1px}
.league-count{font-family:var(--font-en);font-size:9.5px;font-weight:700;color:var(--text-3);padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}

/* ===== MATCH ROW ===== */
.match{display:grid;grid-template-columns:48px 1fr 28px;gap:11px;padding:14px;border-bottom:1px solid var(--stroke);position:relative;cursor:pointer;animation:matchIn .4s var(--ease-out) both}
@keyframes matchIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.match:last-child{border-bottom:none}
.match:active{background:rgba(255,255,255,.035)}
.match.live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--crimson),var(--crimson-2));box-shadow:0 0 12px var(--crimson)}
.match.intl-row::after{content:"🌍";position:absolute;top:8px;right:46px;font-size:10px;opacity:.45}
.match-time{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px}
.match-time .tm{font-family:var(--font-en);font-size:10.5px;font-weight:700;color:var(--text-3)}
.match-time .st{font-family:var(--font-en);font-size:8px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-4)}
.match.live .match-time .tm{color:var(--crimson);font-size:11.5px;display:flex;align-items:center;gap:3px}
.match.live .match-time .tm::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--crimson);animation:pulse 1.2s infinite}
.match.live .match-time .st{color:var(--crimson)}
.match-time .tm.date{color:var(--text-2);font-size:9.5px}
.match-body{display:flex;flex-direction:column;gap:7px;min-width:0}
.mteam{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:9px;min-width:0}
.crest-sm{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-en);font-weight:800;font-size:10px;border:1px solid var(--stroke-2);overflow:hidden;flex-shrink:0}
.mteam .tn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mteam .ts{font-family:var(--font-en);font-weight:800;font-size:15px;min-width:20px;text-align:right;color:var(--text-2)}
.mteam.win .ts{color:var(--lime)}
.mteam.win .tn{font-weight:700;color:#fff}
.mteam.lose .ts{color:var(--text-4);opacity:.7}

/* ===== PREMIUM CREST ===== */
.crest-lg.crest-img,.crest-sm.crest-img{background:rgba(255,255,255,.06);padding:4px;border:1px solid var(--stroke-2)}
.crest-lg.crest-img{padding:7px}
.crest-sm.crest-img{padding:3px}
.crest-lg.crest-img img,.crest-sm.crest-img img{width:100%;height:100%;object-fit:contain}
.crest-premium{position:relative;color:#fff;font-family:var(--font-en);font-weight:900;letter-spacing:-.6px;overflow:hidden;
  border:1px solid rgba(255,255,255,.16)!important;
  background:radial-gradient(circle at 28% 22%, rgba(255,255,255,.28), transparent 55%),
    linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%)!important;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 8px rgba(0,0,0,.35);
  text-shadow:0 1px 4px rgba(0,0,0,.45)}
.crest-premium::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, transparent 48%);pointer-events:none;border-radius:inherit}
.crest-premium::after{content:"";position:absolute;left:-30%;right:-30%;bottom:-70%;height:110%;
  background:radial-gradient(ellipse at center, rgba(255,255,255,.18), transparent 65%);pointer-events:none}
.crest-premium span{position:relative;z-index:1;display:block;line-height:1}
.crest-lg.crest-premium span{font-size:22px}
.crest-sm.crest-premium span{font-size:11px;letter-spacing:-.3px}

.match-star{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);align-self:center;transition:transform .2s var(--ease-spring),background .2s}
.match-star:active{transform:scale(.85)}
.match-star svg{width:14px;height:14px;stroke:var(--text-3);stroke-width:2;fill:none}
.match-star.on svg{stroke:var(--amber);fill:var(--amber)}
.match-star.on{background:rgba(255,176,32,.12);border-color:rgba(255,176,32,.35)}

/* ===== SKELETON ===== */
.sk-group{margin:0 14px 14px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke);overflow:hidden}
.sk-hd{height:44px;border-bottom:1px solid var(--stroke);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:shimmer 1.6s ease infinite}
.sk-row{height:58px;border-bottom:1px solid var(--stroke);padding:14px;display:grid;grid-template-columns:48px 1fr;gap:11px}
.sk-row:last-child{border-bottom:none}
.sk-line{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;border-radius:6px;animation:shimmer 1.6s ease infinite}
.sk-line.t{height:11px;width:30px;margin:4px 0}
.sk-line.n1{height:11px;width:70%}
.sk-line.n2{height:11px;width:55%;margin-top:7px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== EMPTY ===== */
.empty{margin:0 14px 20px;padding:48px 24px;border-radius:var(--r-lg);background:var(--glass);border:1px dashed var(--stroke-2);text-align:center}
.empty .ic{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--stroke);display:grid;place-items:center}
.empty .ic svg{width:22px;height:22px;stroke:var(--text-3);stroke-width:1.6;fill:none}
.empty h3{font-size:13.5px;font-weight:700;margin-bottom:6px}
.empty p{font-size:11.5px;color:var(--text-3);line-height:1.6}

/* ===== ERROR ===== */
.err-card{margin:14px;padding:26px 22px 24px;border-radius:var(--r-xl);text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,59,92,.10),rgba(139,92,246,.06) 60%,var(--glass));border:1px solid rgba(255,59,92,.22)}
.err-ic{width:66px;height:66px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,59,92,.22),rgba(255,59,92,.06));border:1px solid rgba(255,59,92,.32)}
.err-ic svg{width:30px;height:30px;stroke:var(--crimson);stroke-width:1.9;fill:none}
.err-title{font-size:16.5px;font-weight:800;margin-bottom:7px}
.err-desc{font-size:12.5px;color:var(--text-2);line-height:1.65;margin-bottom:20px;max-width:300px;margin-left:auto;margin-right:auto}
.err-actions{display:flex;gap:10px;justify-content:center}
.err-btn{padding:12px 24px;border-radius:13px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.err-btn.primary{background:linear-gradient(135deg,var(--lime),var(--lime-2));color:#050510;box-shadow:0 10px 26px -10px rgba(212,255,58,.7)}
.err-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none}

/* ===== BOTTOM NAV ===== */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:900;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding:0 4px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);
  background:linear-gradient(180deg,rgba(10,10,26,.94),rgba(5,5,16,.99));backdrop-filter:blur(32px) saturate(180%);border-top:1px solid var(--stroke)}
.bnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;font-size:9.5px;font-weight:600;color:var(--text-4);position:relative;transition:color .2s}
.bnav-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.9;fill:none;transition:transform .3s var(--ease-spring)}
.bnav-btn.on{color:var(--lime)}
.bnav-btn.on svg{transform:translateY(-2px) scale(1.08)}
.bnav-btn.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2.5px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--lime),var(--emerald))}
.bnav-btn .badge{position:absolute;top:5px;right:calc(50% - 17px);background:linear-gradient(135deg,var(--crimson),var(--crimson-2));color:#fff;font-size:8px;font-weight:800;font-family:var(--font-en);min-width:15px;height:15px;border-radius:8px;padding:0 4px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg-0)}

/* ===== SHEET ===== */
.mask{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;max-height:88vh;background:linear-gradient(180deg,#10102A,#0A0A1A);
  border-radius:26px 26px 0 0;border-top:1px solid var(--stroke-2);transform:translateY(105%);transition:transform .45s var(--ease-out);
  overflow:hidden;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:12px auto 6px}
.sheet-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--glass-2);border:1px solid var(--stroke-2);display:grid;place-items:center;transition:.2s}
.sheet-close:active{transform:scale(.9)}
.sheet-close svg{width:13px;height:13px;stroke:var(--text-2);stroke-width:2.5;fill:none}
.sheet-body{padding:8px 20px 26px;overflow-y:auto}
.sd-hero{padding:18px 0 22px;border-bottom:1px solid var(--stroke);margin-bottom:20px}
.sd-title{font-size:10.5px;color:var(--text-3);font-family:var(--font-en);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;text-align:center;margin-bottom:7px}
.sd-status{text-align:center;font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:20px}
.sd-status.live{color:var(--crimson)}
.sd-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sd-side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sd-side .crest-lg{width:64px;height:64px;font-size:22px;border-radius:19px}
.sd-side .name{font-size:12.5px;font-weight:700;line-height:1.3;max-width:110px}
.sd-score{font-family:var(--font-en);font-weight:900;font-size:42px;letter-spacing:-2.6px;line-height:1;display:flex;gap:12px;align-items:baseline}
.sd-score i{font-style:normal;color:var(--text-3);font-size:22px;opacity:.5}
.sd-section-title{font-size:10.5px;font-weight:800;color:var(--text-3);font-family:var(--font-en);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:12px;margin-top:20px}
.sd-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sd-info{background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px}
.sd-info small{font-size:9.5px;color:var(--text-3);font-family:var(--font-en);font-weight:600;text-transform:uppercase}
.sd-info b{display:block;font-size:12.5px;font-weight:700;margin-top:4px}

/* ===== H2H & WEATHER ===== */
.h2h-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-bottom:14px;align-items:center}
.h2h-stat{text-align:center;padding:12px;background:var(--glass);border:1px solid var(--stroke);border-radius:12px}
.h2h-stat b{display:block;font-size:20px;font-family:var(--font-en);font-weight:900;color:var(--lime)}
.h2h-stat small{font-size:10px;color:var(--text-3)}
.h2h-vs{font-size:11px;font-weight:800;color:var(--text-3);padding:4px 10px;background:var(--glass);border-radius:999px;border:1px solid var(--stroke)}
.h2h-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.06);margin-bottom:8px}
.h2h-bar i{display:block;height:100%}
.h2h-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-family:var(--font-en)}
.h2h-legend span{display:flex;align-items:center;gap:5px}
.h2h-legend b{width:8px;height:8px;border-radius:2px}
.weather-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--glass);border:1px solid var(--stroke);border-radius:12px}
.weather-icon{font-size:32px}
.weather-info{flex:1}
.weather-info b{display:block;font-size:16px;font-family:var(--font-en);font-weight:800}
.weather-info span{font-size:11px;color:var(--text-3)}

/* ===== TEAM DETAIL ===== */
.team-head{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0;text-align:center;border-bottom:1px solid var(--stroke);margin-bottom:18px}
.team-head .crest-lg{width:80px;height:80px;font-size:30px;border-radius:24px}
.team-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.team-head p{font-size:12px;color:var(--text-3)}
.team-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.team-stat{padding:14px 10px;background:var(--glass);border:1px solid var(--stroke);border-radius:12px;text-align:center}
.team-stat b{display:block;font-size:20px;font-weight:900;font-family:var(--font-en);color:var(--lime)}
.team-stat small{font-size:9.5px;color:var(--text-3);text-transform:uppercase;font-family:var(--font-en);letter-spacing:.4px;margin-top:3px;display:block}

/* ===== PROFILE ===== */
.prof-card{margin:0 14px 14px;padding:22px;border-radius:var(--r-xl);background:linear-gradient(135deg,rgba(212,255,58,.10),rgba(16,185,129,.06));
  border:1px solid rgba(212,255,58,.22);position:relative;overflow:hidden}
.prof-card::before{content:"";position:absolute;top:-40px;right:-30px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,255,58,.28),transparent 65%);filter:blur(8px)}
.prof-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.prof-ava{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,var(--lime),var(--lime-2));
  display:grid;place-items:center;font-family:var(--font-en);font-weight:900;font-size:22px;color:#050510;position:relative}
.prof-ava::after{content:"";position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;border-radius:50%;background:var(--emerald);border:2px solid var(--bg-0)}
.prof-info h3{font-size:15.5px;font-weight:700;margin-bottom:2px}
.prof-info p{font-size:11px;color:var(--text-3);font-family:var(--font-en)}
.prof-badge{margin-left:auto;padding:5px 11px;border-radius:999px;font-family:var(--font-en);font-size:9px;font-weight:800;background:linear-gradient(135deg,var(--lime),var(--lime-2));color:#050510}

/* 🎯 FIXED menu-list */
.menu-list{margin:0 14px}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--stroke);
  border-radius:14px;padding:14px;margin-bottom:8px;text-align:left;transition:transform .2s var(--ease-out),background .2s}
.menu-item:active{transform:scale(.98);background:var(--glass-2)}
.mi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0 !important;overflow:hidden}
.mi-ic svg{width:17px !important;height:17px !important;max-width:17px !important;max-height:17px !important;fill:none !important;stroke-width:1.9 !important}
.mi-ic.gold{background:rgba(212,255,58,.15);border:1px solid rgba(212,255,58,.28)}
.mi-ic.gold svg{stroke:var(--lime) !important}
.mi-ic.violet{background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.28)}
.mi-ic.violet svg{stroke:var(--violet) !important}
.mi-ic.pink{background:rgba(255,59,92,.15);border:1px solid rgba(255,59,92,.28)}
.mi-ic.pink svg{stroke:var(--crimson) !important}
.mi-ic.amber{background:rgba(255,176,32,.15);border:1px solid rgba(255,176,32,.28)}
.mi-ic.amber svg{stroke:var(--amber) !important}
.mi-text{flex:1 !important;min-width:0 !important;text-align:left}
.mi-text b{display:block !important;font-size:13px !important;font-weight:600 !important;color:var(--text) !important}
.mi-text span{font-size:10.5px !important;color:var(--text-3) !important;display:block !important;margin-top:2px !important}
.mi-arrow{width:14px !important;height:14px !important;stroke:var(--text-3) !important;stroke-width:2.4 !important;fill:none !important;flex-shrink:0 !important}
.mi-toggle{margin-left:auto;flex-shrink:0}
.mi-toggle input{appearance:none;width:40px;height:23px;border-radius:11.5px;background:rgba(255,255,255,.1);position:relative;transition:.25s;cursor:pointer}
.mi-toggle input:checked{background:linear-gradient(135deg,var(--lime),var(--lime-2))}
.mi-toggle input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.25s var(--ease-spring)}
.mi-toggle input:checked::after{transform:translateX(17px)}

/* ===== STATS ===== */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 16px}
.stat-card{padding:15px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke)}
.stat-card small{font-size:9.5px;color:var(--text-3);font-family:var(--font-en);font-weight:700;text-transform:uppercase}
.stat-card b{display:block;font-size:24px;font-weight:900;font-family:var(--font-en);margin-top:5px}
.stat-card.live b{color:var(--crimson)}
.stat-card.gold b{color:var(--lime)}

/* ===== SCHEDULE ===== */
.day-block{margin:0 14px 14px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke);overflow:hidden}
.day-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;background:linear-gradient(90deg,rgba(255,255,255,.03),transparent);border-bottom:1px solid var(--stroke)}
.day-num{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--lime),var(--lime-2));
  display:grid;place-items:center;font-family:var(--font-en);font-weight:900;font-size:14px;color:#050510;flex-shrink:0;line-height:1}
.day-num small{display:block;font-size:7.5px;font-weight:800;margin-top:1px}
.day-meta{flex:1}
.day-meta b{display:block;font-size:13px;font-weight:700}
.day-meta span{font-size:10px;color:var(--text-3);font-family:var(--font-en)}

/* ===== ABOUT PAGE — PREMIUM ===== */
.about-hero{text-align:center;padding:30px 20px 24px;position:relative;overflow:hidden}
.about-hero::before{content:"";position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,255,58,.15),transparent 65%);filter:blur(20px);pointer-events:none}
.about-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--lime),var(--lime-2) 60%,#79A81E);
  display:grid;place-items:center;margin:0 auto 16px;position:relative;
  box-shadow:0 20px 50px -20px rgba(212,255,58,.7),inset 0 2px 0 rgba(255,255,255,.5)}
.about-logo::after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%);pointer-events:none}
.about-logo svg{width:40px;height:40px;stroke:#050510;stroke-width:2.4;fill:none;position:relative;z-index:1}
.about-hero h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.about-hero p{font-size:13px;color:var(--text-3);margin-bottom:16px}
.about-ver{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;
  background:linear-gradient(135deg,rgba(212,255,58,.15),rgba(16,185,129,.10));border:1px solid rgba(212,255,58,.28);
  font-family:var(--font-en);font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--lime)}
.about-ver::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 1.5s infinite}

.about-section{margin:0 14px 18px;padding:18px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke)}
.about-section h3{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.about-section h3 .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.about-section h3 .ico svg{width:14px;height:14px;fill:none;stroke-width:2}
.about-section h3 .ico.gold{background:rgba(212,255,58,.15);border:1px solid rgba(212,255,58,.28)}
.about-section h3 .ico.gold svg{stroke:var(--lime)}
.about-section h3 .ico.violet{background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.28)}
.about-section h3 .ico.violet svg{stroke:var(--violet)}
.about-section h3 .ico.pink{background:rgba(255,59,92,.15);border:1px solid rgba(255,59,92,.28)}
.about-section h3 .ico.pink svg{stroke:var(--crimson)}
.about-section h3 .ico.amber{background:rgba(255,176,32,.15);border:1px solid rgba(255,176,32,.28)}
.about-section h3 .ico.amber svg{stroke:var(--amber)}
.about-section p{font-size:12.5px;line-height:1.75;color:var(--text-2)}
.about-section p strong{color:var(--text);font-weight:700}

.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat-item{padding:14px 12px;background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:12px;text-align:center}
.feat-item .fi-ic{font-size:24px;margin-bottom:6px}
.feat-item b{display:block;font-size:11.5px;font-weight:700;margin-bottom:3px}
.feat-item span{font-size:10px;color:var(--text-3);line-height:1.4}

.stat-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat-big-item{padding:14px;background:linear-gradient(135deg,rgba(212,255,58,.08),rgba(16,185,129,.04));
  border:1px solid rgba(212,255,58,.15);border-radius:12px}
.stat-big-item b{display:block;font-size:22px;font-family:var(--font-en);font-weight:900;
  background:linear-gradient(135deg,var(--lime),var(--emerald));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-big-item small{font-size:10px;color:var(--text-3);display:block;margin-top:3px;font-family:var(--font-en);letter-spacing:.4px;text-transform:uppercase}

.tech-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tech-chip{padding:6px 12px;border-radius:999px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);
  font-family:var(--font-en);font-size:10px;font-weight:700;color:#C4B5FD;letter-spacing:.3px}

.credit-box{margin:0 14px 18px;padding:18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,rgba(212,255,58,.10),rgba(255,176,32,.06));
  border:1px solid rgba(212,255,58,.22);text-align:center}
.credit-box .heart{font-size:24px;margin-bottom:8px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.credit-box h4{font-size:13px;font-weight:700;margin-bottom:4px}
.credit-box p{font-size:11.5px;color:var(--text-3);line-height:1.6}
.credit-box b{color:var(--lime);font-weight:700}

/* ===== TOAST ===== */
.toast{position:fixed;top:calc(var(--hdr-h) + env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%) translateY(-24px) scale(.9);
  z-index:9999;padding:11px 18px;border-radius:13px;background:linear-gradient(135deg,rgba(16,185,129,.96),rgba(5,150,105,.96));
  color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 14px 40px -10px rgba(16,185,129,.7);opacity:0;
  transition:all .4s var(--ease-spring);pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.toast.goal{background:linear-gradient(135deg,rgba(255,176,32,.96),rgba(217,119,6,.96));box-shadow:0 14px 40px -10px rgba(255,176,32,.7)}

/* ===== CONFETTI ===== */
#confetti{position:fixed;inset:0;z-index:9998;pointer-events:none;display:none}
#confetti.on{display:block}

/* ===== PULL TO REFRESH ===== */
.ptr{position:fixed;top:calc(var(--hdr-h) + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-60px);
  z-index:880;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke-2);
  backdrop-filter:blur(12px);font-size:11px;color:var(--text-2);font-weight:600;transition:transform .3s var(--ease-out);display:flex;align-items:center;gap:6px}
.ptr.on{transform:translateX(-50%) translateY(8px)}
.ptr svg{width:14px;height:14px;stroke:var(--lime);stroke-width:2.4;fill:none}
.ptr.spin svg{animation:spin .8s linear infinite}

@media (min-width:480px){
  body{max-width:480px;margin:0 auto}
  .hdr,.bnav,.mask,.sheet,.offline-bar,.ptr{max-width:480px;left:50%;transform:translateX(-50%)}
  .sheet{transform:translate(-50%,105%)}
  .sheet.on{transform:translate(-50%,0)}
  .offline-bar{transform:translateX(-50%) translateY(-100%)}
  .offline-bar.on{transform:translateX(-50%) translateY(0)}
  .ptr{transform:translateX(-50%) translateY(-60px)}
  .ptr.on{transform:translateX(-50%) translateY(8px)}
}
</style>
</head>

/* ================================================================

const $$=s=>Array.from(document.querySelectorAll(s));

/* Favorites */
function getFavs(){ try{ return JSON.parse(localStorage.getItem('favs')||'[]'); }catch{ return []; } }
function saveFavs(a){ localStorage.setItem('favs',JSON.stringify(a)); updateFavCount(); }
function isFav(n){ if(!n) return false; return getFavs().some(f=>f.toLowerCase()===n.toLowerCase()); }
function updateFavCount(){ const el=$('#favCount'); if(el) el.textContent=getFavs().length+'টি টিম সেভ করা আছে'; }
function isFavMatch(m){ return isFav(m.home)||isFav(m.away)||(m.teams||[]).some(t=>isFav(t)); }

/* Connection */
let lastSuccessAt=0;
function setConnection(s){
  state.connection=s;
  const d=$('#connDot'),b=$('#offlineBar');
  if(!d||!b) return;
  if(s==='online'){ d.classList.remove('off','checking'); b.classList.remove('on'); }
  else if(s==='offline'){ d.classList.remove('checking'); d.classList.add('off'); b.classList.add('on'); }
  else { d.classList.remove('off'); d.classList.add('checking'); b.classList.remove('on'); }
}
function reportSuccess(){ state.consecutiveFails=0; lastSuccessAt=Date.now(); if(state.connection!=='online') setConnection('online'); }
function reportFailure(){ if(lastSuccessAt&&(Date.now()-lastSuccessAt)<90000) return; state.consecutiveFails++; if(state.consecutiveFails>=15) setConnection('offline'); }
window.addEventListener('online',()=>{ state.consecutiveFails=0; setConnection('checking'); showStatus('✅ সংযোগ ফিরেছে','ok'); loadFootball(); loadCricket(); });

async function fetchWithTimeout(url,opts={},ms=FETCH_TIMEOUT){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ return await fetch(url,{...opts,signal:c.signal}); }
  catch(e){ if(e.name==='AbortError') throw new Error('timeout'); throw e; }
  finally{ clearTimeout(t); }
}

/* Notifications */
let notiEnabled=localStorage.getItem('notiEnabled')==='1';
function hasNotiPermission(){ return 'Notification' in window && Notification.permission==='granted'; }
async function enableNotifications(){
  if(!('Notification' in window)){ showStatus('এই ব্রাউজারে নোটিফিকেশন নেই','err'); return false; }
  if(Notification.permission==='denied'){ showStatus('ব্রাউজার সেটিংস থেকে অনুমতি দিন','err'); return false; }
  if(Notification.permission!=='granted'){ const p=await Notification.requestPermission(); if(p!=='granted') return false; }
  return true;
}
function sendNotification(title,body,tag){ if(!notiEnabled||!hasNotiPermission()) return; try{ new Notification(title,{body,tag:tag||'match'}); }catch(e){} }

function toast(msg,type='ok'){ const el=$('#toast'); if(!el) return; el.textContent=msg; el.className='toast on'+(type==='goal'?' goal':''); setTimeout(()=>el.classList.remove('on'),4200); }

/* Confetti */
function confetti(){
  const cvs=$('#confetti'); if(!cvs) return;
  cvs.classList.add('on');
  const dpr=window.devicePixelRatio||1;
  cvs.width=window.innerWidth*dpr; cvs.height=window.innerHeight*dpr;
  cvs.style.width=window.innerWidth+'px'; cvs.style.height=window.innerHeight+'px';
  const ctx=cvs.getContext('2d'); ctx.scale(dpr,dpr);
  const W=window.innerWidth,H=window.innerHeight;
  const colors=['#FFD86B','#FF3B5C','#D4FF3A','#22D3EE','#A855F7','#FFB020'];
  const pieces=[];
  for(let i=0;i<120;i++){ pieces.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,vx:(Math.random()-.5)*3,vy:3+Math.random()*5,size:6+Math.random()*8,color:colors[i%colors.length],rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*0.3,shape:Math.random()>0.5?'rect':'circle'}); }
  let start=Date.now();
  function loop(){
    const elapsed=Date.now()-start;
    ctx.clearRect(0,0,W,H);
    let alive=0;
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.rot+=p.vr;
      if(p.y<H+30){
        alive++;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,1-elapsed/2500);
        if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
        else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      }
    });
    if(alive>0 && elapsed<2500) requestAnimationFrame(loop);
    else { ctx.clearRect(0,0,W,H); cvs.classList.remove('on'); }
  }
  loop();
}

/* Goals detection */
function getScoresSnapshot(){ try{ return JSON.parse(localStorage.getItem('lastScores')||'{}'); }catch{ return {}; } }
function saveScoresSnapshot(o){ localStorage.setItem('lastScores',JSON.stringify(o)); }
function detectGoals(matches){
  if(!notiEnabled) return;
  const old=getScoresSnapshot(); const curr={};
  matches.forEach(m=>{
    if(!m.id.startsWith('fb')) return;
    curr[m.id]={h:m.hs,a:m.as};
    if(old[m.id]){
      const oh=old[m.id].h,oa=old[m.id].a,nh=m.hs,na=m.as;
      if(oh!=null&&oa!=null&&nh!=null&&na!=null&&(nh>oh||na>oa)){
        const scorer=nh>oh?m.home:m.away;
        const fav=isFavMatch(m);
        sendNotification((fav?'⭐ ':'')+'⚽ গোল! '+scorer, m.home+' '+nh+' - '+na+' '+m.away, m.id);
        toast('⚽ গোল! '+scorer+' · '+m.home+' '+nh+' - '+na+' '+m.away,'goal');
        confetti();
      }
    }
  });
  saveScoresSnapshot(curr);
}

/* Helpers */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0; return Math.abs(h); }
function colorFor(n){ return COLORS[hashStr(n||'')%COLORS.length]; }
function initials(n){
  if(!n) return '?';
  let name=String(n).replace(/^\d+\.\s*/,'').replace(/\./g,' ').trim();
  const words=name.split(/\s+/).filter(w=>w.length>0);
  if(words.length===0) return '?';
  if(words.length===1) return words[0].slice(0,2).toUpperCase();
  const skip=['fc','sc','cf','ac','afc','u21','u23','u19','u20','u17','u18','u16','women','w','ii','b','c','cd','ca','club','de','the'];
  const meaningful=words.filter(w=>!skip.includes(w.toLowerCase()));
  if(meaningful.length>=2) return (meaningful[0][0]+meaningful[1][0]).toUpperCase();
  if(meaningful.length===1) return meaningful[0].slice(0,2).toUpperCase();
  return (words[0][0]+(words[1][0]||words[0][1]||'')).toUpperCase();
}
function crestHTML(url,name,size){
  const cls=size==='lg'?'crest-lg':'crest-sm';
  if(url){
    const [c1,c2]=colorFor(name||'');
    const fallback='<div class="'+cls+' crest-premium" style="--c1:'+c1+';--c2:'+c2+'"><span>'+initials(name)+'</span></div>';
    const b64=btoa(unescape(encodeURIComponent(fallback))).replace(/=/g,'');
    return '<div class="'+cls+' crest-img"><img src="'+url+'" alt="'+escapeHtml(name||'')+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.parentElement.outerHTML=atob(\''+b64+'\')"></div>';
  }
  const [c1,c2]=colorFor(name||'');
  return '<div class="'+cls+' crest-premium" style="--c1:'+c1+';--c2:'+c2+'"><span>'+initials(name)+'</span></div>';
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatTime(u){ try{ return new Date(u).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}); }catch{ return '--:--'; } }
function dateKeyOf(u){ try{ const d=new Date(u); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch{ return ''; } }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDate(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function relDate(dk){
  try{
    const d=new Date(dk); d.setHours(0,0,0,0); const t=new Date(); t.setHours(0,0,0,0);
    const diff=Math.round((t-d)/86400000);
    if(diff===0) return 'আজ'; if(diff===1) return 'গতকাল'; if(diff===2) return '২ দিন আগে'; if(diff===3) return '৩ দিন আগে';
    if(diff===-1) return 'আগামীকাল'; if(diff===-2) return '২ দিন পরে'; if(diff===-3) return '৩ দিন পরে';
    return dk.slice(5).replace('-','/');
  }catch{ return dk; }
}
function monthShortNum(mm){ const bn=['জানু','ফেব্রু','মার্চ','এপ্রি','মে','জুন','জুলা','আগ','সেপ','অক্টো','নভে','ডিসে']; return bn[parseInt(mm,10)-1]||''; }

const INTL_KEYWORDS=['world cup','fifa world','uefa','nations league','euro','europ','european championship','qualification','qualifier','qualifying','friendly','friendlies','international','copa','copa america','conmebol','afcon','africa cup','african cup','africa nations','asian cup','afc asian','afc cup','gold cup','concacaf','olympic','olympics','u21','u23','u19','u20','u17','u18','u16','pan american','south american','asian games','saff','south asian'];
function isInternational(m){
  const l=(m.comp||'').toLowerCase();
  for(const kw of INTL_KEYWORDS){ if(l.includes(kw)) return true; }
  const hints=['national','bangladesh','india','pakistan','sri lanka','nepal','afghanistan','brazil','argentina','france','germany','spain','italy','england','portugal','netherlands','belgium','croatia','denmark','sweden','norway','poland','serbia','switzerland','austria','japan','korea','china','australia','iran','iraq','saudi','qatar','uae','mexico','usa','united states','canada','morocco','egypt','nigeria','senegal','ghana','cameroon','tunisia','algeria','south africa','new zealand'];
  const h=(m.home||'').toLowerCase(),a=(m.away||'').toLowerCase();
  return hints.some(n=>h.includes(n))&&hints.some(n=>a.includes(n));
}

let statusTimer=null;
function showStatus(text,type='ok'){
  let el=$('#statusBar');
  if(!el){ el=document.createElement('div'); el.id='statusBar';

/* BSD API */
async function bsd(path){
  const res=await fetchWithTimeout(BSD_HOST+path,{headers:{'Authorization':'Token '+BSD_TOKEN}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function loadLeagues(){
  try{
    const d=await bsd('/api/v2/leagues/?limit=200');
    (d.results||[]).forEach(l=>{ state.leagues[l.id]={name:l.name,country:l.country||''}; });
  }catch(e){ console.warn('Leagues failed',e); }
}
async function loadTeamInfo(id){
  if(state.teams[id]) return state.teams[id];
  try{ const d=await bsd('/api/v2/teams/'+id+'/'); state.teams[id]=d; return d; }
  catch(e){ return null; }
}

/* Load Football */
async function loadFootball(){
  if(!state.football.length){
    $('#footballLive').innerHTML=skeleton();
    $('#footballUpcoming').innerHTML='';
    $('#footballFinished').innerHTML='';
    $('#footballIntl').innerHTML='';
  }
  try{
    if(Object.keys(state.leagues).length===0) await loadLeagues();
    const calls=[ bsd('/api/v2/events/live/').catch(()=>({events:[]})) ];
    for(let i=-DAYS_BACK;i<=DAYS_AHEAD;i++){
      calls.push(bsd('/api/v2/events/?date='+isoDate(i)+'&limit=200').catch(()=>({results:[]})));
    }
    const results=await Promise.all(calls);
    const liveRes=results[0];
    const dayResults=results.slice(1);
    const map=new Map();
    (liveRes.events||[]).forEach(e=>{ if(e&&e.id) map.set(e.id,e); });
    dayResults.forEach(r=>{ (r.results||[]).forEach(e=>{ if(e&&e.id) map.set(e.id,e); }); });
    const newData=Array.from(map.values()).map(normalizeFootball).filter(Boolean);
    if(newData.length>0||state.football.length===0) state.football=newData;
    if(newData.length>0) reportSuccess();
    detectGoals(state.football);
    renderFootball(); updateNavBadge(); updateTicker();
    if(state.football.length){
      const intlCount=state.football.filter(m=>m.intl).length;
      const liveCount=state.football.filter(m=>m.live).length;
      showStatus('⚽ '+state.football.length+' ম্যাচ · 🔴 '+liveCount+' · 🌍 '+intlCount,'ok');
    }
  }catch(err){
    console.error('[football]',err); reportFailure();
    if(state.football.length){ showStatus('পুরনো ডেটা','err'); }
    else {
      $('#footballHero').innerHTML=''; $('#footballIntl').innerHTML=''; $('#footballLive').innerHTML='';
      $('#footballUpcoming').innerHTML=errorCard('ফুটবল ডেটা লোড হয়নি', err.message||'', 'window.__retryFootball()');
      $('#footballFinished').innerHTML='';
    }
  }
}
window.__retryFootball=()=>{ setConnection('checking'); $('#footballUpcoming').innerHTML=skeleton(); loadFootball(); };

function normalizeFootball(e){
  if(!e||!e.home_team||!e.away_team) return null;
  const status=(e.status||'').toLowerCase();
  let cat='upcoming';
  if(status==='live'||status==='inprogress'||status==='playing'||status==='liveht') cat='live';
  else if(status==='finished'||status==='ended'||status==='fulltime') cat='finished';
  const utc=e.event_date||'';
  const dateKey=dateKeyOf(utc)||todayKey();
  const hs=e.home_score!=null?e.home_score:null;
  const as=e.away_score!=null?e.away_score:null;
  let minute='';
  if(cat==='live'){ minute=e.current_minute?e.current_minute+"'":(e.period||'LIVE'); }
  const league=state.leagues[e.league_id]||{};
  const obj={id:'fb-'+e.id,cat,live:cat==='live',minute,utc,timeStr:utc,dateKey,comp:league.name||'Football',area:league.country||'',home:e.home_team||'Home',away:e.away_team||'Away',homeFull:e.home_team||'Home',awayFull:e.away_team||'Away',homeCrest:'',awayCrest:'',homeId:e.home_team_id,awayId:e.away_team_id,hs,as,status:e.status||'',raw:e};
  obj.intl=isInternational(obj);
  return obj;
}

window.__toggleFav=function(el){

function switchPage(name){
  haptic();
  state.page=name;
  $$('.bnav-btn').forEach(b=>b.classList.toggle('on',b.dataset.page===name));
  $$('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+name));

}
$$('.bnav-btn').forEach(btn=>{ btn.onclick=()=>switchPage(btn.dataset.page); });

function renderScorePage(){
  const list=state.sport==='football'?state.football:state.cricket;
  const live=list.filter(m=>m.live);
  const today=list.filter(m=>m.dateKey===todayKey());
  $('#statLive').textContent=live.length;
  $('#statTotal').textContent=today.length;
  const box=$('#scoreList');
  const sorted=list.slice().sort((a,b)=>{ const r={live:0,upcoming:1,finished:2}; if(r[a.cat]!==r[b.cat]) return r[a.cat]-r[b.cat]; return new Date(a.utc||a.date)-new Date(b.utc||b.date); });
  if(!sorted.length){ box.innerHTML=emptyState('স্কোর নেই',''); return; }
  const renderer=state.sport==='football'?renderRow:renderCricketRow;
  box.innerHTML='<div class="league-group" style="margin:0 14px">'+sorted.map(renderer).join('')+'</div>';
  bindClicks();
}
function renderSchedulePage(){
  const list=state.sport==='football'?state.football:state.cricket;
  const box=$('#scheduleList');
  if(!list.length){ box.innerHTML=emptyState('সময়সূচি নেই',''); return; }
  const g={}; list.forEach(m=>{ const k=m.dateKey; if(k) (g[k]||=[]).push(m); });
  const dates=Object.keys(g).sort();
  const renderer=state.sport==='football'?renderRow:renderCricketRow;
  box.innerHTML=dates.map(dk=>{
    const ms=g[dk].slice().sort((a,b)=>new Date(a.utc||a.date)-new Date(b.utc||b.date));
    const parts=dk.split('-');
    return '<div class="day-block"><div class="day-hd"><div class="day-num">'+parts[2]+'<small>'+monthShortNum(parts[1])+'</small></div><div class="day-meta"><b>'+escapeHtml(relDate(dk))+'</b><span>'+ms.length+' MATCHES</span></div></div>'+ms.map(renderer).join('')+'</div>';
  }).join('');
  bindClicks();
}

    <h3><span class="ico gold"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>প্রাইভেসি</h3>
    <p>আমরা <strong>কোনো ব্যক্তিগত তথ্য সংগ্রহ করি না</strong>। কোনো লগইন নেই, কোনো ট্র্যাকিং নেই, কোনো অ্যাকাউন্ট নেই। আপনার প্রিয় টিম শুধু আপনার ফোনেই সেভ থাকে। সাইট ১০০% অ্যানোনিমাস।</p>
  </div>

  <div class="credit-box">
    <div class="heart">💚</div>
    <h4>ভালোবাসা দিয়ে তৈরি</h4>

    <p style="margin-top:10px;font-family:var(--font-en);font-size:10.5px;letter-spacing:.4px">© 2026 আমার খেলাঘর · Made with ❤️ in BD</p>

  `;
  $('#sheetBody').innerHTML=html;
  $('#mask').classList.add('on'); $('#sheet').classList.add('on');
}

/* Sport */
$$('.sport-btn').forEach(btn=>{
  btn.onclick=()=>{
    haptic();
    const s=btn.dataset.sport; if(s===state.sport) return;
    state.sport=s;
    $$('.sport-btn').forEach(b=>b.classList.toggle('on',b.dataset.sport===s));
    $('#sportSwitch').dataset.active=s;
    $('#footballPanel').style.display=s==='football'?'':'none';
    $('#cricketPanel').style.display=s==='cricket'?'':'none';
    const list=s==='football'?state.football:state.cricket;
    updateCounts(applySearch(list)); updateNavBadge();
    window.scrollTo({top:0});
  };
});

/* Chips */
$$('#chips .chip').forEach(c=>{
  c.onclick=()=>{
    haptic();
    $$('#chips .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    state.filter=c.dataset.filter;
    if(state.sport==='football') renderFootball(); else renderCricket();
    window.scrollTo({top:0});
  };
});

/* Search */
$('#searchInput').addEventListener('input',(e)=>{
  state.search=e.target.value.trim();
  matchIdx=0;
  if(state.sport==='football') renderFootball(); else renderCricket();
});

/* Refresh */
$('#refreshBtn').onclick=async()=>{
  haptic();
  const btn=$('#refreshBtn');
  btn.classList.add('spin');
  setConnection('checking');
  state.consecutiveFails=0;
  await Promise.all([loadFootball(),loadCricket()]);
  setTimeout(()=>btn.classList.remove('spin'),500);
};

/* Noti button */
$('#notiBtn').onclick=()=>{
  haptic();
  const live=(state.football.concat(state.cricket)).filter(m=>m.live).length;
  const intl=state.football.filter(m=>m.intl).length;
  const fav=state.football.filter(m=>isFavMatch(m)).length;
  const icon=state.connection==='online'?'🟢':state.connection==='offline'?'🔴':'🟡';
  showStatus(icon+' '+live+' লাইভ · 🌍 '+intl+' · ⭐ '+fav,'ok');
};

/* Notification toggle */
$('#notiToggle').checked=notiEnabled;
$('#notiToggle').onchange=async(e)=>{
  if(e.target.checked){
    const ok=await enableNotifications();
    if(!ok){ e.target.checked=false; return; }
    notiEnabled=true; localStorage.setItem('notiEnabled','1');
    $('#notiStatus').textContent='চালু আছে ✅';
    showStatus('🔔 নোটিফিকেশন চালু','ok');
  } else {
    notiEnabled=false; localStorage.setItem('notiEnabled','0');
    $('#notiStatus').textContent='বন্ধ আছে';
    showStatus('🔕 নোটিফিকেশন বন্ধ','');
  }
};
if(notiEnabled) $('#notiStatus').textContent='চালু আছে ✅';

/* Profile buttons */
$('#btnFavs').onclick=()=>{
  haptic();
  switchPage('home');
  setTimeout(()=>{
    $$('#chips .chip').forEach(x=>x.classList.remove('on'));
    const favChip=$$('#chips .chip').find(c=>c.dataset.filter==='favorites');
    if(favChip){ favChip.classList.add('on'); state.filter='favorites'; renderFootball(); }
  },300);
};
$('#btnClearFavs').onclick=()=>{
  haptic();
  if(!confirm('সব প্রিয় টিম মুছে ফেলবেন?')) return;
  saveFavs([]);
  showStatus('⭐ সব প্রিয় টিম মুছে ফেলা হয়েছে','');
  if(state.filter==='favorites') renderFootball();
};
$('#btnAbout').onclick=()=>{ openAbout(); };

/* PWA */
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredInstallPrompt=e;
  $('#installBtn').style.display='grid';
});
async function doInstall(){
  haptic();
  if(!deferredInstallPrompt){ showStatus('ব্রাউজার মেনু → Add to Home Screen চাপুন',''); return; }
  deferredInstallPrompt.prompt();
  const {outcome}=await deferredInstallPrompt.userChoice;
  if(outcome==='accepted'){ showStatus('✅ অ্যাপ ইনস্টল হয়েছে','ok'); $('#installBtn').style.display='none'; }
  deferredInstallPrompt=null;
}
$('#installBtn').onclick=doInstall;
$('#btnInstall2').onclick=doInstall;

/* Pull to refresh */
(function(){
  let startY=0, pulling=false, triggered=false;
  const ptr=$('#ptr');
  document.addEventListener('touchstart',(e)=>{ if(window.scrollY===0) startY=e.touches[0].clientY; },{passive:true});
  document.addEventListener('touchmove',(e)=>{ if(window.scrollY!==0||!startY) return; const y=e.touches[0].clientY-startY; if(y>60&&!pulling&&!triggered){ pulling=true; ptr.classList.add('on'); } },{passive:true});
  document.addEventListener('touchend',async()=>{
    if(pulling){ triggered=true; ptr.classList.add('spin'); setConnection('checking'); await Promise.all([loadFootball(),loadCricket()]); setTimeout(()=>{ ptr.classList.remove('on','spin'); pulling=false; triggered=false; startY=0; },600); }
  });
})();

/* Init */
setConnection('checking');
loadFootball();
loadCricket();
updateFavCount();

setInterval(()=>{
  if(document.hidden) return;
  if(state.connection==='offline') return;
  loadFootball(); loadCricket();
  if(state.page==='score') renderScorePage();
  if(state.page==='schedule') renderSchedulePage();
}, REFRESH_MS);
</script>
